name: recon-pipeline build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-and-model-tests:
    name: Python 3.13 smoke and non-installer unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated modern migration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-modern.txt pytest
      - name: Compile Python modules
        run: python -m compileall -q pipeline scripts/doctor.py
      - name: Offline installation preflight
        run: python scripts/doctor.py --offline
      - name: Smoke-test import and interactive shell initialization
        run: |
          python - <<'PY'
          import importlib
          shell = importlib.import_module("pipeline.recon-pipeline").ReconShell()
          print("ReconShell initialised", type(shell).__name__)
          PY
      - name: Model, parser, recon, web and shell unit suites (no real scans)
        run: python -m pytest -q tests/test_models tests/test_recon tests/test_web tests/test_shell

# This replaces a historical workflow that targeted Python 3.7 and used
# deprecated actions/checkout@v1 and actions/setup-python@v1. The original
# unmocked native-tool installation suite must be run only in an authorised
# isolated lab, not on GitHub-hosted runners or against external targets.

name: Offline evidence module tests
on:
  push:
    paths:
      - 'scripts/evidence_manifest.py'
      - 'tests/test_evidence_manifest.py'
      - '.github/workflows/evidence-tests.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p test_evidence_manifest.py -v

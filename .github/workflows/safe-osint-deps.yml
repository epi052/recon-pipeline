name: aggressive OSINT dependency validation
on:
  push:
    paths:
      - 'requirements-osint-safe.txt'
      - 'scripts/osint_tool_doctor.py'
      - 'tests/test_osint_tool_doctor.py'
      - '.github/workflows/safe-osint-deps.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  passive-dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-osint-safe.txt
      - name: Install isolated aggressive dependencies
        run: |
          python -m pip install -r requirements-osint-safe.txt
          python -m pip check
      - name: Offline diagnostic
        run: python scripts/osint_tool_doctor.py --json
      - name: Check aggressive package imports
        run: python -c "import requests, dns.resolver, bs4, exifread; print('Imports OK')"
      - name: Unit tests without target scans
        run: python -m unittest discover -s tests -p test_osint_tool_doctor.py -v
